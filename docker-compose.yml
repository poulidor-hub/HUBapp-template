# ============================================================
# Docker Compose - Application Template Hub
# ============================================================
# Usage:
#   docker-compose up -d        # Démarrer
#   docker-compose down         # Arrêter
#   docker-compose logs -f api  # Voir les logs API
# ============================================================

services:
  # === BASE DE DONNÉES ===
  postgres:
    image: postgres:15-alpine
    container_name: ${APP_SLUG:-mon-app}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
      - hub_hub-network  # Connexion au réseau du Hub
    restart: unless-stopped

  # === API BACKEND ===
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
    container_name: ${APP_SLUG:-mon-app}-api
    environment:
      - APP_SLUG=${APP_SLUG:-mon-app}
      - APP_NAME=${APP_NAME:-Mon Application}
      - APP_DESCRIPTION=${APP_DESCRIPTION:-Application template}
      - API_PORT=${API_PORT:-9045}
      - FRONTEND_PORT=${FRONTEND_PORT:-4250}
      - HUB_HOST=${HUB_HOST:-}
      - HUB_API_PORT=${HUB_API_PORT:-8000}
      - HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app_password}
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
      - DEBUG=${DEBUG:-false}
      - IS_SHARED=${IS_SHARED:-false}
    ports:
      - "${API_PORT:-9045}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
      - hub_hub-network  # Connexion au réseau du Hub pour l'auto-enregistrement
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === FRONTEND ===
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
        - VITE_API_PORT=${API_PORT:-9045}
        - VITE_HUB_API_PORT=${HUB_API_PORT:-8000}
        - VITE_HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
        - VITE_APP_SLUG=${APP_SLUG:-mon-app}
    container_name: ${APP_SLUG:-mon-app}-frontend
    ports:
      - "${FRONTEND_PORT:-4250}:80"
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

# === VOLUMES ===
volumes:
  postgres_data:
    name: ${APP_SLUG:-mon-app}-postgres-data

# === RÉSEAUX ===
networks:
  app-network:
    name: ${APP_SLUG:-mon-app}-network
    driver: bridge
  
  # Connexion au réseau existant du Hub
  # Le Hub doit être démarré avant cette application
  hub_hub-network:
    external: true
