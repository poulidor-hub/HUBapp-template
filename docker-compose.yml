# ============================================================
# Docker Compose - Application Template Hub
# ============================================================
# Usage:
#   docker-compose up -d        # Démarrer
#   docker-compose down         # Arrêter
#   docker-compose logs -f api  # Voir les logs API
# ============================================================

services:
  # === BASE DE DONNÉES ===
  postgres:
    image: postgres:15-alpine
    container_name: ${APP_SLUG:-mon-app}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # === API BACKEND ===
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
    container_name: ${APP_SLUG:-mon-app}-api
    environment:
      - APP_SLUG=${APP_SLUG}
      - APP_NAME=${APP_NAME}
      - APP_DESCRIPTION=${APP_DESCRIPTION}
      # APP_HOST : auto-détecté au démarrage si vide
      - APP_HOST=${APP_HOST:-}
      - API_PORT=${API_PORT}
      - API_HTTPS_PORT=${API_HTTPS_PORT:-}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-}
      - HUB_HOST=${HUB_HOST}
      - HUB_API_PORT=${HUB_API_PORT}
      - HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT}
      - POSTGRES_HOST=${APP_SLUG}-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DEBUG=${DEBUG:-false}
      - IS_SHARED=${IS_SHARED:-false}
      - HUB_HTTPS_PORT=${HUB_HTTPS_PORT:-443}
      - UPLOADS_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
      # Volume pour les certificats téléchargés (hub-ca.crt)
      - certs_data:/app/certs/hub
      # Certificats serveur de l'application (lecture/écriture pour téléchargement auto)
      # Note: Les certificats sont téléchargés automatiquement depuis le Hub si absents
      - server_certs:/app/certs/server
    ports:
      - "${API_PORT:-9045}:8000"
      - "${API_HTTPS_PORT:-9046}:8443"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    # Permet de résoudre host.docker.internal vers l'IP de l'hôte
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health || curl -sfk https://localhost:8443/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === FRONTEND ===
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
        - VITE_API_PORT=${API_PORT:-9045}
        - VITE_HUB_API_PORT=${HUB_API_PORT:-8000}
        - VITE_HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
        - VITE_HUB_HTTPS_PORT=${HUB_HTTPS_PORT:-443}
        - VITE_APP_SLUG=${APP_SLUG:-mon-app}
    container_name: ${APP_SLUG:-mon-app}-frontend
    environment:
      - APP_SLUG=${APP_SLUG:-mon-app}
      - HUB_HOST=${HUB_HOST}
      - HUB_API_PORT=${HUB_API_PORT:-8000}
      - APP_HOST=${APP_HOST:-}
    ports:
      - "${FRONTEND_PORT:-4250}:80"
      - "${FRONTEND_HTTPS_PORT:-4251}:443"
    volumes:
      # Volume partagé pour les certificats SSL (téléchargés automatiquement si absents)
      - frontend_certs:/etc/nginx/ssl
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

# === VOLUMES ===
volumes:
  postgres_data:
    name: ${APP_SLUG:-mon-app}-postgres-data
  uploads_data:
    name: ${APP_SLUG:-mon-app}-uploads-data
  certs_data:
    name: ${APP_SLUG:-mon-app}-certs-data
  server_certs:
    name: ${APP_SLUG:-mon-app}-server-certs
  frontend_certs:
    name: ${APP_SLUG:-mon-app}-frontend-certs

# === RÉSEAUX ===
# L'application communique avec le Hub via son IP (HUB_HOST)
# Pas besoin de réseau Docker partagé
networks:
  app-network:
    name: ${APP_SLUG:-mon-app}-network
    driver: bridge
