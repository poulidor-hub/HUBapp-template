# ============================================================
# Docker Compose - Application Template Hub
# ============================================================
# Usage:
#   docker-compose up -d        # Démarrer
#   docker-compose down         # Arrêter
#   docker-compose logs -f api  # Voir les logs API
# ============================================================

services:
  # === BASE DE DONNÉES ===
  postgres:
    image: postgres:15-alpine
    container_name: ${APP_SLUG:-mon-app}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      # Port interne du serveur PostgreSQL, piloté par POSTGRES_PORT (.env).
      # PGPORT est honoré par le serveur ET les outils clients du conteneur
      # (psql, pg_dump, pg_isready du healthcheck).
      PGPORT: ${POSTGRES_PORT:-5432}
      TZ: UTC
    # === Profil mémoire explicite (surchargeable via .env, clés PG_*) ===
    # Défauts calibrés pour une station modeste (limite 512M ci-dessous).
    # Station avec plus de RAM : surcharger via le .env (cf. .env.example,
    # section « TUNING POSTGRESQL ») — aucun changement du compose nécessaire.
    command: postgres -c shared_buffers=${PG_SHARED_BUFFERS:-128MB} -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-384MB} -c work_mem=${PG_WORK_MEM:-8MB} -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
    # Mémoire partagée POSIX (/dev/shm) du conteneur — PostgreSQL l'utilise
    # pour ses buffers partagés ; défaut aligné sur shared_buffers.
    shm_size: ${PG_SHM_SIZE:-128m}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network
    restart: unless-stopped
    # === Durcissement (audit sécurité #21) ===
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # postgres démarre en root puis bascule sur l'utilisateur postgres (chown du datadir)
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID

  # === API BACKEND ===
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
        # Image socle sur laquelle l'app fine est construite (Dockerfile.backend
        # : FROM poulidor/socle-api:${SOCLE_VERSION}). Version pilotée par le
        # .env — sync_socle_version.py (make sync-env) l'aligne sur le checkout
        # HUBsocle du parc.
        - SOCLE_VERSION=${APP_SOCLE_VERSION:?APP_SOCLE_VERSION manquant — lancez `make update-env` (fusionne .env.example dans .env)}
    container_name: ${APP_SLUG:-mon-app}-api
    environment:
      - APP_SLUG=${APP_SLUG}
      - APP_NAME=${APP_NAME}
      - APP_DESCRIPTION=${APP_DESCRIPTION}
      # APP_HOST : auto-détecté au démarrage si vide
      - APP_HOST=${APP_HOST:-}
      - API_PORT=${API_PORT}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - HTTPS_ENABLED=${HTTPS_ENABLED:-true}
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-}
      - HUB_HOST=${HUB_HOST}
      - HUB_INTERNAL_HOST=${HUB_INTERNAL_HOST:-}
      - HUB_API_PORT=${HUB_API_PORT:-8000}
      - HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
      - POSTGRES_HOST=${APP_SLUG:-mon-app}-postgres
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DEBUG=${DEBUG:-false}
      - IS_SHARED=${IS_SHARED:-false}
      - UPLOADS_DIR=/app/uploads
      # Répertoire ssl/ vu de cert_sync.py (volume partagé ./ssl:/app/ssl).
      # Sans cette variable, le défaut résoudrait vers /ssl (hors volume).
      - SSL_DIR=/app/ssl
    volumes:
      - uploads_data:/app/uploads
      - storage_data:/app/storage
      # Partagé avec le frontend (./ssl:/etc/nginx/ssl) — permet à cert_sync.py
      # de réécrire les certs HTTPS émis par la PKI du HUB, visibles de nginx.
      - ./ssl:/app/ssl
    ports:
      - "${API_PORT:-9045}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    # Permet de résoudre host.docker.internal vers l'IP de l'hôte
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # 1G : les backups volumineux créent le ZIP sur disque (streaming),
          # mais l'API reste le service le plus gourmand (JSON des tables en RAM)
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # === Durcissement (audit sécurité #21) ===
    # L'app tourne en appuser (uid 1000, port non privilégié) : l'entrypoint
    # démarre root, répare la propriété des volumes de données puis bascule
    # en appuser via gosu. Caps strictement nécessaires :
    # - CHOWN/SETUID/SETGID : chown des volumes + drop de privilèges gosu
    #   (même pattern que le service postgres de ce compose)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  # === FRONTEND ===
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # Sources du socle frontend (HUBsocle) : montées comme contexte `socle`
      # puis copiées dans l'image AVANT npm install (dep file:../socle/frontend).
      additional_contexts:
        socle: ../../HUBsocle
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
        - VITE_API_PORT=${API_PORT:-9045}
        - VITE_HUB_API_PORT=${HUB_API_PORT:-8000}
        - VITE_HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
        - VITE_APP_SLUG=${APP_SLUG:-mon-app}
    container_name: ${APP_SLUG:-mon-app}-frontend
    environment:
      - APP_SLUG=${APP_SLUG:-mon-app}
      - FRONTEND_PORT=${FRONTEND_PORT:-4250}
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT}
      - HTTPS_ENABLED=${HTTPS_ENABLED:-true}
      - HUB_HOST=${HUB_HOST}
      - HUB_API_PORT=${HUB_API_PORT:-8000}
      - APP_HOST=${APP_HOST:-}
    ports:
      - "${FRONTEND_PORT:-4250}:80"
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - app-network
    # Utiliser le nom 'backend' pour le proxy nginx (voir nginx-ssl.conf)
    links:
      - api:backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # === Durcissement (audit sécurité #21) ===
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Le seul privilège requis est le bind des ports 80/443 (pattern HUB_base).
      - NET_BIND_SERVICE

# === VOLUMES ===
volumes:
  postgres_data:
    name: ${APP_SLUG:-mon-app}-postgres-data
  uploads_data:
    name: ${APP_SLUG:-mon-app}-uploads-data
  storage_data:
    name: ${APP_SLUG:-mon-app}-storage-data

# === RÉSEAUX ===
# L'application communique avec le Hub via son IP (HUB_HOST)
# Pas besoin de réseau Docker partagé
networks:
  app-network:
    name: ${APP_SLUG:-mon-app}-network
    driver: bridge
    ipam:
      config:
        # Sous-réseau attribué par le Hub (pool APP_SUBNET_POOL, défaut 10.50.0.0/16).
        # Rempli par ACTIONS/PYTHON/allocate_ports.py à la première exécution de
        # `make up`/`make build` (champ `subnet` de /api/apps/allocate-ports).
        # Épinglage obligatoire : le pool Docker par défaut (172.16/12) est saturé
        # et retombe sur 192.168.16.0/20, qui chevauche le VPN du routeur.
        - subnet: ${APP_SUBNET:?APP_SUBNET manquant — lancez `make sync-env` (allocation via le Hub)}
