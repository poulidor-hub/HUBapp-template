# ============================================================
# Docker Compose - Application DISTANTE (hôte séparé du Hub)
# ============================================================
# Utiliser ce fichier pour les applications sur un serveur différent du Hub.
#
# Usage:
#   docker-compose -f docker-compose.remote.yml up -d
#   docker-compose -f docker-compose.remote.yml down
#   docker-compose -f docker-compose.remote.yml logs -f api
#
# Configuration requise dans .env :
#   - APP_HOST=<IP de ce serveur visible depuis le Hub>
#   - HUB_HOST=<IP du Hub visible depuis ce serveur>
#   - APP_WHITELIST_NETWORKS dans le .env du Hub doit inclure votre réseau
#
# ============================================================

services:
  # === BASE DE DONNÉES ===
  postgres:
    image: postgres:15-alpine
    container_name: ${APP_SLUG:-mon-app}-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # === API BACKEND ===
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
    container_name: ${APP_SLUG:-mon-app}-api
    environment:
      - APP_SLUG=${APP_SLUG}
      - APP_NAME=${APP_NAME}
      - APP_DESCRIPTION=${APP_DESCRIPTION}
      - APP_HOST=${APP_HOST:-}
      - API_PORT=${API_PORT}
      - API_HTTPS_PORT=${API_HTTPS_PORT:-}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - FRONTEND_HTTPS_PORT=${FRONTEND_HTTPS_PORT:-}
      - HUB_HOST=${HUB_HOST}
      - HUB_API_PORT=${HUB_API_PORT}
      - HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT}
      - POSTGRES_HOST=${APP_SLUG}-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - DEBUG=${DEBUG:-false}
      - IS_SHARED=${IS_SHARED:-false}
      - HUB_HTTPS_ENABLED=${HUB_HTTPS_ENABLED:-false}
      - HUB_HTTPS_PORT=${HUB_HTTPS_PORT:-443}
      - HUB_CA_CERT_PATH=${HUB_CA_CERT_PATH:-/app/certs/hub-ca.crt}
      - APP_SSL_CERT_PATH=${APP_SSL_CERT_PATH:-/app/certs/server/mon-app/app.crt}
      - APP_SSL_KEY_PATH=${APP_SSL_KEY_PATH:-/app/certs/server/mon-app/app.key}
      - UPLOADS_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
      # Certificats : seront téléchargés depuis le Hub automatiquement
      # ou copiés manuellement depuis le Hub si pas d'accès HTTP initial
      - ./certs:/app/certs:rw
    ports:
      - "${API_PORT:-9045}:8000"
      - "${API_HTTPS_PORT:-9046}:8443"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    # Permet d'accéder au réseau de l'hôte pour joindre le Hub
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health", "||", "curl", "-fk", "https://localhost:8443/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # === FRONTEND ===
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
        - VITE_API_PORT=${API_PORT:-9045}
        - VITE_HUB_API_PORT=${HUB_API_PORT:-8000}
        - VITE_HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
        - VITE_HUB_HTTPS_PORT=${HUB_HTTPS_PORT:-443}
        - VITE_APP_SLUG=${APP_SLUG:-mon-app}
    container_name: ${APP_SLUG:-mon-app}-frontend
    environment:
      - APP_SLUG=${APP_SLUG:-mon-app}
    ports:
      - "${FRONTEND_PORT:-4250}:80"
      - "${FRONTEND_HTTPS_PORT:-4251}:443"
    volumes:
      # Certificats SSL (montés depuis certs/server/${APP_SLUG}/)
      - ./certs/server/${APP_SLUG:-mon-app}/app.crt:/etc/nginx/ssl/app.crt:ro
      - ./certs/server/${APP_SLUG:-mon-app}/app.key:/etc/nginx/ssl/app.key:ro
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

# === VOLUMES ===
volumes:
  postgres_data:
    name: ${APP_SLUG:-mon-app}-postgres-data
  uploads_data:
    name: ${APP_SLUG:-mon-app}-uploads-data

# === RÉSEAU SIMPLE (pas de connexion Docker au Hub) ===
networks:
  app-network:
    name: ${APP_SLUG:-mon-app}-network
    driver: bridge
