# Configuration nginx avec HTTPS (SSL auto-signé)

# Rediriger HTTP vers HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}

# Serveur HTTPS
server {
    listen 443 ssl;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Limite de taille pour les uploads
    client_max_body_size 1G;

    # Certificats SSL
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    
    # Paramètres SSL modernes
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy vers l'API backend locale (évite les problèmes CORS)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        client_max_body_size 1G;
    }

    # Proxy vers le Hub SSO (évite Mixed Content HTTPS→HTTP)
    # Le frontend appelle /hub/* et nginx proxifie vers le Hub HTTP
    # ${HUB_HOST} et ${HUB_API_PORT} sont substitués par docker-entrypoint.sh
    location /hub/ {
        proxy_pass http://${HUB_HOST}:${HUB_API_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE: désactiver le buffering pour les events en temps réel
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;  # 24h pour SSE
    }

    # HTML : toujours revalider (empêche le navigateur de servir un index.html périmé)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
    }

    # Design system runtime (HUBCSS). Le pointeur "current" doit rester revalidé
    # (swappable au runtime en Phase 2). ^~ pour battre le regex d'assets immutables.
    location ^~ /design-system/current/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    # Fichiers statiques
    # Callback SSO des app fines socle : le Hub y revient avec le JWT ET le
    # refresh_token en query param (?token=…&refresh_token=…) — $request les
    # logguerait en clair dans les access logs persistants du conteneur.
    # Route servie en SPA avec logs désactivés ; PAS de try_files (son
    # fallback re-matche location = /index.html, sans le off, et la requête
    # serait loggée là) — rewrite + break sert index.html dans cette location.
    # L'URL est ensuite purgée côté client (history.replaceState, AuthContext).
    location = /callback {
        access_log off;
        rewrite ^ /index.html break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pour les assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
