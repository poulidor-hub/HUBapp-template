# =============================================================================
# Docker Compose — Développement uniquement (overlay explicite)
# =============================================================================
# Ce fichier n'est PAS chargé automatiquement. Pour le développement :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   (ou: make dev / make up-dev)
# En production, n'utilisez QUE le fichier de base :
#   docker compose -f docker-compose.yml up -d   (ou: make up)
# =============================================================================

services:
  api:
    command: --reload
    environment:
      - DEBUG=true
      - ENABLE_DEMO_ENDPOINTS=true
    volumes:
      - uploads_data:/app/uploads
      - ./backend:/app
      - ./VERSION:/app/VERSION:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
      args:
        - APP_VERSION=${APP_VERSION:-0.0.0}
    ports:
      - "${FRONTEND_PORT:-4250}:3000"
    environment:
      - HUB_HOST=${HUB_HOST}
      - HUB_API_PORT=${HUB_API_PORT:-8000}
      - VITE_APP_VERSION=${APP_VERSION:-0.0.0}
      - VITE_API_PORT=${API_PORT:-9045}
      - VITE_HUB_API_PORT=${HUB_API_PORT:-8000}
      - VITE_HUB_FRONTEND_PORT=${HUB_FRONTEND_PORT:-80}
      - VITE_APP_SLUG=${APP_SLUG:-mon-app}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - /app/node_modules
