server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Limite de taille pour les uploads
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Proxy vers l'API backend (HTTP interne)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }

    # Proxy vers le Hub SSO (HTTP) pour éviter Mixed Content
    # ${HUB_HOST} et ${HUB_API_PORT} sont substitués par docker-entrypoint.sh
    location /hub/ {
        proxy_pass http://${HUB_HOST}:${HUB_API_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
    }

    # HTML : toujours revalider (empêche le navigateur de servir un index.html périmé)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
    }

    # Design system runtime (HUBCSS). Le pointeur "current" doit rester revalidé
    # (swappable au runtime en Phase 2). ^~ pour battre le regex d'assets immutables.
    location ^~ /design-system/current/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    # Fichiers statiques
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pour les assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
