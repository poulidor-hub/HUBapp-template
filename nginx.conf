server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Limite de taille pour les uploads
    client_max_body_size 1G;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Headers de sécurité — snippet factorisé.
    # Sémantique nginx : une location qui définit le moindre add_header perd
    # TOUS les add_header hérités du bloc server. Ce snippet est donc inclus
    # ici ET en tête de chaque location qui redéfinit add_header (cache
    # HTML/assets), pour que les headers partent sur TOUTES les réponses.
    include /etc/nginx/templates/security-headers.conf;

    # Proxy vers l'API backend (HTTP interne)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        client_max_body_size 1G;
    }

    # Proxy vers le Hub SSO (HTTP) pour éviter Mixed Content
    # ${HUB_HOST} et ${HUB_API_PORT} sont substitués par docker-entrypoint.sh
    location /hub/ {
        proxy_pass http://${HUB_HOST}:${HUB_API_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 86400s;
    }

    # HTML : toujours revalider (empêche le navigateur de servir un index.html périmé)
    location = /index.html {
        include /etc/nginx/templates/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
    }

    # Design system runtime (HUBCSS). Le pointeur "current" doit rester revalidé
    # (swappable au runtime en Phase 2). ^~ pour battre le regex d'assets immutables.
    location ^~ /design-system/current/ {
        include /etc/nginx/templates/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
        try_files $uri =404;
    }

    # Fichiers statiques
    # Callback SSO des app fines socle : le Hub y revient avec le JWT ET le
    # refresh_token en query param (?token=…&refresh_token=…) — $request les
    # logguerait en clair dans les access logs persistants du conteneur.
    # Route servie en SPA avec logs désactivés ; PAS de try_files (son
    # fallback re-matche location = /index.html, sans le off, et la requête
    # serait loggée là) — rewrite + break sert index.html dans cette location.
    # L'URL est ensuite purgée côté client (history.replaceState, AuthContext).
    location = /callback {
        access_log off;
        rewrite ^ /index.html break;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pour les assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp)$ {
        include /etc/nginx/templates/security-headers.conf;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
