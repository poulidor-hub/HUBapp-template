<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canevas — Cahier des charges</title>
  <link rel="stylesheet" href="frontend/public/design-system/current/global.css">
  <link rel="stylesheet" href="frontend/public/design-system/current/bootstrap-icons/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    /* Alias locaux → tokens source HUBCSS (cf. charte : mapping identique au app.css
       de la React app). global.css définit les --hub-color-* mais PAS ces alias, donc
       on les réexpose ici pour que toutes les règles ci-dessous (bordures de champs,
       fonds, accents…) résolvent correctement dans les 2 thèmes. */
    :root {
      --bg-primary:     var(--hub-color-page);
      --bg-secondary:   var(--hub-color-surface);
      --text-primary:   var(--hub-color-text);
      --text-secondary: var(--hub-color-muted);
      --accent:         var(--hub-color-primary);
      --accent-strong:  var(--hub-color-primary-strong);
      --surface-muted:  var(--hub-color-surface-muted);
      --success:        var(--hub-color-success);
      --error:          var(--hub-color-danger);
      --warning:        var(--hub-color-warning);
      --border:         var(--hub-color-border);
      /* --on-accent : texte sur fond accentué (valeur de contraste indépendante du thème ;
         l'accent est saturé dans les 2 thèmes, le blanc reste lisible). Token centralisé. */
      --on-accent: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--hub-font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-areas: "header header" "sommaire main";
      min-height: 100vh;
    }
    header.app-header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: var(--hub-space-4, 16px);
      padding: var(--hub-space-4, 16px) var(--hub-space-6, 24px);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    header.app-header h1 { font-size: var(--hub-font-size-xl, 20px); margin: 0; flex: 1 1 auto; }
    .toolbar { display: flex; gap: var(--hub-space-2, 8px); align-items: center; flex-wrap: wrap; }
    #progress { font-size: var(--hub-font-size-sm, 14px); color: var(--text-secondary); }

    .btn {
      font-family: inherit; font-size: var(--hub-font-size-sm, 14px);
      padding: var(--hub-space-2, 8px) var(--hub-space-3, 12px);
      border: 1px solid var(--border); border-radius: var(--radius-hub, 8px);
      background: var(--bg-secondary); color: var(--text-primary); cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .btn-secondary { background: var(--bg-secondary); }
    .btn-small { padding: var(--hub-space-1, 4px) var(--hub-space-2, 8px); font-size: var(--hub-font-size-xs, 12px); }
    .btn-danger { color: var(--error); border-color: var(--error); }
    .btn i.bi, .acc-header i.bi, .sommaire-list i.bi { margin-right: var(--hub-space-2, 8px); }

    #import-error {
      display: none; margin: 0 var(--hub-space-6, 24px) var(--hub-space-3, 12px);
      padding: var(--hub-space-3, 12px); border-radius: var(--radius-hub, 8px);
      background: var(--error); color: var(--on-accent); font-size: var(--hub-font-size-sm, 14px);
    }
    #import-error.show { display: block; }

    aside#sommaire {
      grid-area: sommaire;
      position: sticky; top: 0; align-self: start;
      max-height: 100vh; overflow-y: auto;
      padding: var(--hub-space-4, 16px);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
    }
    aside#sommaire h2 { font-size: var(--hub-font-size-sm, 14px); text-transform: uppercase; color: var(--text-secondary); margin: 0 0 var(--hub-space-2, 8px); }
    .sommaire-list { list-style: none; margin: 0; padding: 0; }
    .sommaire-list li { margin-bottom: var(--hub-space-1, 4px); }
    .sommaire-list a {
      display: flex; align-items: center; gap: var(--hub-space-2, 8px);
      color: var(--text-primary); text-decoration: none; font-size: var(--hub-font-size-sm, 14px);
      padding: var(--hub-space-1, 4px) var(--hub-space-2, 8px); border-radius: var(--radius-hub-sm, 6px);
    }
    .sommaire-list a:hover { background: var(--bg-primary); }
    .ind { width: 10px; text-align: center; color: var(--text-secondary); }
    .ind.filled { color: var(--success); }
    .attribution { margin-top: var(--hub-space-4, 16px); padding-top: var(--hub-space-3, 12px); border-top: 1px solid var(--border); font-size: var(--hub-font-size-xs, 12px); color: var(--text-secondary); line-height: 1.5; }
    .attribution a { color: var(--accent); }

    main#sections { grid-area: main; padding: var(--hub-space-6, 24px); max-width: 900px; }

    section.acc { border: 1px solid var(--border); border-radius: var(--radius-hub, 8px); margin-bottom: var(--hub-space-3, 12px); background: var(--bg-secondary); overflow: hidden; }
    .acc-header {
      width: 100%; text-align: left; display: flex; align-items: center; gap: var(--hub-space-2, 8px);
      padding: var(--hub-space-3, 12px) var(--hub-space-4, 16px);
      background: transparent; border: none; cursor: pointer;
      font-family: inherit; font-size: var(--hub-font-size-md, 16px); font-weight: var(--hub-font-weight-semibold, 600);
      color: var(--text-primary);
    }
    .acc-header:hover { background: var(--bg-primary); }
    .acc-chevron { margin-left: auto; transition: transform .15s; color: var(--text-secondary); }
    section.acc.open .acc-chevron { transform: rotate(180deg); }
    .acc-body { display: none; padding: var(--hub-space-4, 16px); border-top: 1px solid var(--border); }
    section.acc.open .acc-body { display: block; }

    .field { margin-bottom: var(--hub-space-3, 12px); }
    .field label { display: block; font-size: var(--hub-font-size-sm, 14px); margin-bottom: var(--hub-space-1, 4px); color: var(--text-secondary); }
    .field input[type=text], .field textarea, .field select, .data-input {
      width: 100%; font-family: inherit; font-size: var(--hub-font-size-sm, 14px);
      padding: var(--hub-space-2, 8px); border: 1px solid var(--border); border-radius: var(--radius-hub-sm, 6px);
      background: var(--bg-primary); color: var(--text-primary);
    }
    .field input[type=text]:focus-visible, .field textarea:focus-visible, .field select:focus-visible, .data-input:focus-visible {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--hub-color-primary-soft, color-mix(in srgb, var(--accent) 25%, transparent));
    }
    .field textarea { min-height: 60px; resize: vertical; }
    .field .req { color: var(--error); }

    .list-item {
      border: 1px solid var(--border); border-radius: var(--radius-hub-sm, 6px);
      padding: var(--hub-space-3, 12px); margin-bottom: var(--hub-space-2, 8px); background: var(--bg-primary);
    }
    .list-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--hub-space-2, 8px); }
    .list-item-head .title { font-weight: var(--hub-font-weight-semibold, 600); font-size: var(--hub-font-size-sm, 14px); }
    .list-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--hub-space-2, 8px); }
    .hint { font-size: var(--hub-font-size-sm, 14px); color: var(--text-secondary); font-style: italic; }

    .mermaid-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: var(--hub-space-3, 12px); }
    .mermaid-wrap textarea { min-height: 200px; font-family: var(--hub-font-mono); }
    #mermaid-preview { border: 1px dashed var(--border); border-radius: var(--radius-hub-sm, 6px); padding: var(--hub-space-3, 12px); min-height: 200px; background: var(--bg-primary); text-align: center; }
    .cheatsheet { font-size: var(--hub-font-size-xs, 12px); color: var(--text-secondary); background: var(--bg-primary); padding: var(--hub-space-2, 8px); border-radius: var(--radius-hub-sm, 6px); margin-top: var(--hub-space-2, 8px); }

    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-areas: "header" "sommaire" "main"; }
      aside#sommaire { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
      .list-grid, .mermaid-wrap { grid-template-columns: 1fr; }
    }
    @media print {
      body { display: block; }
      aside#sommaire, .toolbar, .acc-chevron { display: none !important; }
      section.acc .acc-body { display: block !important; }
      section.acc { break-inside: avoid; border: none; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1><span id="app-title">Nouveau cahier des charges</span></h1>
    <span id="progress">0/10 sections</span>
    <div class="toolbar">
      <button class="btn btn-primary" id="btn-md" disabled>Exporter Markdown</button>
      <button class="btn btn-secondary" id="btn-json-export" disabled>Exporter JSON</button>
      <button class="btn btn-secondary" id="btn-bootstrap">Spécification agent (JSON)</button>
      <button class="btn btn-secondary" id="btn-json-import">Importer JSON</button>
      <input type="file" id="json-file" accept="application/json" hidden>
      <button class="btn btn-secondary" id="btn-print">Imprimer / PDF</button>
      <button class="btn btn-secondary" id="btn-theme">Mode sombre</button>
    </div>
  </header>
  <div id="import-error" role="alert"></div>
  <aside id="sommaire"><h2>Sommaire</h2><ul class="sommaire-list" id="sommaire-list"></ul><p class="attribution">© 2026 <strong>POULIDOR</strong> Audit &amp; Développement<br><span class="hint">Outil interne — <a href="LICENSE.md">licence</a></span></p></aside>
  <main id="sections"></main>
  <script>
  // ============================================================ SCHEMA (100 % métier)
  // L'agent Jellycode dérive la couche technique (modèle de données, endpoints,
  // permissions, écrans) à partir de cette description métier.
  const SCHEMA = {
    objectif: { title: '1. À quoi sert cette application ?', icon: 'bi bi-bullseye', type: 'object', fields: [
      { key: 'app', label: 'Nom de l\'application', type: 'text', required: true },
      { key: 'auteur', label: 'Auteur (nom / prénom) — qui crée l\'application', type: 'text' },
      { key: 'mainteneur', label: 'Mainteneur du code (nom / prénom)', type: 'text' },
      { key: 'objectif', label: 'Objectif métier (en une phrase)', type: 'text', required: true },
      { key: 'contexte', label: 'Contexte, problème à résoudre', type: 'textarea' },
      { key: 'pourQui', label: 'Pour qui (bénéficiaires)', type: 'textarea' },
    ]},
    situation: { title: '2. Comment ça se passe aujourd\'hui ?', icon: 'bi bi-clock-history', type: 'object', fields: [
      { key: 'existant', label: 'Comment c\'est fait aujourd\'hui (outil, processus, manuel, Excel, autre app…)', type: 'textarea' },
      { key: 'etapes', label: 'Les grandes étapes du processus actuel (une par ligne)', type: 'textarea' },
      { key: 'douleurs', label: 'Points de douleur / problèmes rencontrés aujourd\'hui (une par ligne)', type: 'textarea' },
    ]},
    acteurs: { title: '3. Qui sont les utilisateurs ?', icon: 'bi bi-people-fill', type: 'list', addLabel: '+ Utilisateur', item: [
      { key: 'role', label: 'Rôle métier (ex : auditeur, responsable, client)', type: 'text' },
      { key: 'description', label: 'Que fait cette personne, son contexte', type: 'textarea' },
    ]},
    informations: { title: '4. Quelles sont les informations gérées ?', icon: 'bi bi-database-fill', type: 'list', addLabel: '+ Objet métier', item: [
      { key: 'objet', label: 'Objet métier (ex : clients, dossiers, factures)', type: 'text' },
      { key: 'infos', label: 'Les informations importantes de cet objet (en langage courant)', type: 'textarea' },
      { key: 'precisions', label: 'Précisions (optionnel)', type: 'textarea' },
    ]},
    actions: { title: '5. Que font les utilisateurs avec ces informations ?', icon: 'bi bi-arrow-left-right', type: 'list', addLabel: '+ Action', item: [
      { key: 'acteur', label: 'Qui (acteur)', type: 'text' },
      { key: 'action', label: 'Action (ex : crée, consulte, modifie, valide, supprime…)', type: 'text' },
      { key: 'objet', label: 'Sur quel objet', type: 'text' },
      { key: 'detail', label: 'Détail / condition (optionnel)', type: 'textarea' },
    ]},
    ecrans: { title: '6. Quels écrans / parcours sont attendus ?', icon: 'bi bi-display', type: 'list', addLabel: '+ Écran / parcours', item: [
      { key: 'nom', label: 'Nom de l\'écran ou du parcours', type: 'text' },
      { key: 'objectif', label: 'Ce que l\'utilisateur y fait / objectif', type: 'textarea' },
      { key: 'precisions', label: 'Précisions (optionnel)', type: 'textarea' },
    ]},
    regles: { title: '7. Quelles sont les règles à respecter ?', icon: 'bi bi-list-check', type: 'list', addLabel: '+ Règle', item: [
      { key: 'regle', label: 'La règle / contrainte (en langage métier)', type: 'textarea' },
      { key: 'precisions', label: 'Précisions (optionnel)', type: 'textarea' },
    ]},
    processus: { title: '8. Quel est le processus / déroulement ?', icon: 'bi bi-signpost-2-split', custom: 'mermaid' },
    echanges: { title: '9. Avec quels autres systèmes échanger ?', icon: 'bi bi-plug-fill', type: 'list', addLabel: '+ Échange', item: [
      { key: 'systeme', label: 'Système / application', type: 'text' },
      { key: 'flux', label: 'Quel échange (ex : « synchro clients depuis le CRM »)', type: 'textarea' },
    ]},
    exigences: { title: '10. Quelles sont les exigences & contraintes ?', icon: 'bi bi-shield-check', type: 'object', fields: [
      { key: 'performance', label: 'Attentes de performance / rapidité', type: 'textarea' },
      { key: 'acces', label: 'Accès & sécurité (qui peut voir quoi, confidentialité)', type: 'textarea' },
      { key: 'contraintes', label: 'Contraintes (réglementaires, organisationnelles…)', type: 'textarea' },
      { key: 'autres', label: 'Autres exigences', type: 'textarea' },
    ]},
  };
  const SCHEMA_ORDER = Object.keys(SCHEMA);

  // ============================================================ ETAT
  function DEFAULT_STATE() {
    return {
      meta: { version: '1.0', updatedAt: new Date().toISOString().slice(0,10) },
      sections: {
        objectif: { app:'', auteur:'', mainteneur:'', objectif:'', contexte:'', pourQui:'' },
        situation: { existant:'', etapes:'', douleurs:'' },
        acteurs: [],
        informations: [],
        actions: [],
        ecrans: [],
        regles: [],
        processus: { mermaid: 'flowchart TD\n    A([Déclencheur]) --> B{Décision}\n    B -->|Oui| C[Étape 1]\n    B -->|Non| D[Étape 2]\n    C --> E([Résultat])\n    D --> E' },
        echanges: [],
        exigences: { performance:'', acces:'', contraintes:'', autres:'' },
      }
    };
  }
  let state = DEFAULT_STATE();
  let dirty = false;
  const CUSTOM_RENDERERS = {};

  // ============================================================ HELPERS UI
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function slugize(n) { return (n||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'app'; }
  function markDirty(){ dirty = true; }
  function clearDirty(){ dirty = false; }

  // Une section est « commencée » si elle contient au moins une valeur non vide
  function sectionIsEmpty(key) {
    const s = SCHEMA[key];
    const v = state.sections[key];
    if (s.type === 'object') return s.fields.every(f => !(v[f.key] && String(v[f.key]).trim()));
    if (s.type === 'list') return !v.some(it => Object.values(it).some(x => x && String(x).trim()));
    if (s.custom === 'mermaid') return !(v.mermaid && v.mermaid.trim());
    return true;
  }

  // ============================================================ RENDU
  function renderAll() {
    const main = $('sections');
    main.innerHTML = '';
    SCHEMA_ORDER.forEach(key => main.appendChild(renderSection(key)));
    renderSommaire();
    updateProgress();
    updateTitle();
  }

  function renderSection(key) {
    const s = SCHEMA[key];
    const sec = el('section', 'acc');
    sec.id = 'sec-' + key;
    const header = el('button', 'acc-header');
    header.innerHTML =
      '<span class="ind" data-ind="' + key + '">○</span>' +
      '<span><i class="' + s.icon + '"></i>' + s.title + '</span>' +
      '<span class="acc-chevron">▾</span>';
    header.addEventListener('click', () => sec.classList.toggle('open'));
    const body = el('div', 'acc-body');
    sec.appendChild(header);
    sec.appendChild(body);
    renderSectionBody(key, body);
    updateSectionIndicator(key);
    return sec;
  }

  function renderSectionBody(key, body) {
    if (!body) body = $('sec-' + key).querySelector('.acc-body');
    body.innerHTML = '';
    const s = SCHEMA[key];
    if (s.custom) {
      if (CUSTOM_RENDERERS[s.custom]) body.appendChild(CUSTOM_RENDERERS[s.custom](key, s));
      else body.appendChild(el('p', 'hint', '(rendu dédié à venir)'));
    } else if (s.type === 'object') {
      s.fields.forEach(f => body.appendChild(renderField(key, f)));
    } else if (s.type === 'list') {
      body.appendChild(renderList(key, s));
    }
  }
  function rerenderSectionBody(key) {
    renderSectionBody(key, null);
    updateSectionIndicator(key);
    updateProgress();
  }

  function renderField(sectionKey, f) {
    const wrap = el('div', 'field');
    wrap.appendChild(el('label', null, f.label + (f.required ? ' <span class="req">*</span>' : '')));
    let input;
    if (f.type === 'textarea') input = el('textarea');
    else if (f.type === 'select') { input = el('select'); f.options.forEach(o => { const op = el('option'); op.value = o; op.textContent = o; input.appendChild(op); }); }
    else { input = el('input'); input.type = 'text'; }
    input.value = state.sections[sectionKey][f.key] || '';
    input.addEventListener('input', () => {
      state.sections[sectionKey][f.key] = input.value;
      markDirty();
      if (sectionKey === 'objectif') updateTitle();
      updateSectionIndicator(sectionKey);
      updateProgress();
      setExportEnabled();
    });
    wrap.appendChild(input);
    return wrap;
  }

  function renderList(sectionKey, s) {
    const container = el('div', 'list-section');
    const items = el('div', 'list-items');
    container.appendChild(items);
    state.sections[sectionKey].forEach((it, idx) => items.appendChild(renderListItem(sectionKey, s, idx)));
    const addBtn = el('button', 'btn btn-secondary btn-small', s.addLabel || '+ Ajouter');
    addBtn.addEventListener('click', () => {
      const newItem = {};
      s.item.forEach(f => { newItem[f.key] = f.type === 'select' ? f.options[0] : ''; });
      state.sections[sectionKey].push(newItem);
      markDirty();
      rerenderSectionBody(sectionKey);
      setExportEnabled();
    });
    container.appendChild(addBtn);
    return container;
  }

  function renderListItem(sectionKey, s, idx) {
    const item = state.sections[sectionKey][idx];
    const card = el('div', 'list-item');
    const head = el('div', 'list-item-head');
    const titleTxt = (item[s.item[0].key] && String(item[s.item[0].key]).trim()) || ('Élément ' + (idx+1));
    head.appendChild(el('span', 'title', titleTxt));
    const del = el('button', 'btn btn-danger btn-small', '<i class="bi bi-x"></i> Supprimer');
    del.addEventListener('click', () => {
      state.sections[sectionKey].splice(idx, 1);
      markDirty();
      rerenderSectionBody(sectionKey);
      setExportEnabled();
    });
    head.appendChild(del);
    card.appendChild(head);
    const grid = el('div', 'list-grid');
    s.item.forEach(f => {
      const cell = el('div', 'field');
      cell.appendChild(el('label', null, f.label));
      let input;
      if (f.type === 'textarea') input = el('textarea');
      else if (f.type === 'select') { input = el('select'); f.options.forEach(o => { const op = el('option'); op.value = o; op.textContent = o; input.appendChild(op); }); }
      else { input = el('input'); input.type = 'text'; }
      input.value = item[f.key] || '';
      input.addEventListener('input', () => {
        item[f.key] = input.value;
        markDirty();
        if (f.key === s.item[0].key) head.querySelector('.title').textContent = input.value.trim() || ('Élément ' + (idx+1));
        updateSectionIndicator(sectionKey);
        updateProgress();
        setExportEnabled();
      });
      cell.appendChild(input);
      grid.appendChild(cell);
    });
    card.appendChild(grid);
    return card;
  }

  // ============================================================ SOMMAIRE / PROGRESSION
  function renderSommaire() {
    const ul = $('sommaire-list'); ul.innerHTML = '';
    SCHEMA_ORDER.forEach(key => {
      const li = el('li');
      const a = el('a', null, '<span class="ind" data-ind="' + key + '">○</span> ' + SCHEMA[key].title);
      a.href = '#sec-' + key;
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        const sec = $('sec-' + key); sec.classList.add('open');
        sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      li.appendChild(a); ul.appendChild(li);
    });
  }
  function updateSectionIndicator(key) {
    const filled = !sectionIsEmpty(key);
    document.querySelectorAll('[data-ind="' + key + '"]').forEach(n => {
      n.textContent = filled ? '●' : '○';
      n.classList.toggle('filled', filled);
    });
  }
  function updateProgress() {
    const total = SCHEMA_ORDER.length;
    const done = SCHEMA_ORDER.filter(k => !sectionIsEmpty(k)).length;
    $('progress').textContent = done + '/' + total + ' sections';
  }
  function updateTitle() {
    const app = state.sections.objectif.app;
    const auteur = state.sections.objectif.auteur;
    let t = app ? ('Cahier des charges — ' + app) : 'Nouveau cahier des charges';
    if (app && auteur && auteur.trim()) t += ' · ' + auteur.trim();
    $('app-title').textContent = t;
  }
  function setExportEnabled() { /* les exports sont activés dans initChrome */ }

  // ============================================================ §8 PROCESSUS (Mermaid)
  let mermaidReady = false;
  if (window.mermaid) { try { window.mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'default' }); mermaidReady = true; } catch(e){ mermaidReady = false; } }
  let renderTimer = null;
  CUSTOM_RENDERERS.mermaid = function (key, s) {
    const wrap = el('div');
    const grid = el('div', 'mermaid-wrap');
    const ta = el('textarea');
    ta.value = state.sections[key].mermaid || '';
    ta.setAttribute('spellcheck', 'false');
    const preview = el('div'); preview.id = 'mermaid-preview';
    grid.appendChild(ta); grid.appendChild(preview);
    wrap.appendChild(grid);
    wrap.appendChild(el('div', 'cheatsheet',
      '<strong>Antisèche :</strong> flowchart TD (top-down) ou LR (left-right). ' +
      'Nœuds : <code>A[Texte]</code>, <code>B{Décision}</code>, <code>C([Arrondi])</code>, <code>D((Cercle))</code>. ' +
      'Liens : <code>A --&gt; B</code>, <code>A --&gt;|Oui| B</code>, <code>C -. pointillé .-&gt; D</code>. Subgraph : <code>subgraph Nom ... end</code>.'
    ));
    function doRender() {
      const code = ta.value;
      state.sections[key].mermaid = code;
      if (!mermaidReady || !code.trim()) { preview.innerHTML = '<span class="hint">Aperçu indisponible (Mermaid non chargé ou code vide).</span>'; return; }
      const id = 'mmd-' + Date.now();
      window.mermaid.render(id, code).then(res => { preview.innerHTML = res.svg; })
        .catch(err => { preview.innerHTML = '<span class="hint" style="color:var(--error)">Erreur Mermaid : ' + String(err.message || err).replace(/[<>]/g,'') + '</span>'; });
    }
    ta.addEventListener('input', () => {
      markDirty(); updateSectionIndicator(key); updateProgress(); setExportEnabled();
      clearTimeout(renderTimer); renderTimer = setTimeout(doRender, 300);
    });
    setTimeout(doRender, 50);
    return wrap;
  };

  // ============================================================ EXPORT MARKDOWN
  function download(filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = el('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/\r\n|\n|\r/g, ' ').replace(/\|/g, '\\|'); }
  function listMd(s) {
    const items = String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
    return items.length ? items.map(i => '- ' + esc(i)).join('\n') + '\n' : '_—_\n';
  }
  function tableMd(rows, keys, headers) {
    if (!rows || !rows.length) return '_Aucun._\n';
    let t = '|' + headers.map(h => esc(h)).join('|') + '|\n' + '|' + headers.map(() => '---').join('|') + '|\n';
    rows.forEach(r => { t += '|' + keys.map(k => esc(r[k] || '')).join('|') + '|\n'; });
    return t;
  }
  function exportMarkdown() {
    const S = state.sections;
    const app = S.objectif.app || '(sans nom)';
    let md = '# Cahier des charges — ' + app + '\n\n';
    md += '> Spécification métier. La couche technique (modèle de données, endpoints, écrans) sera dérivée par l\'agent.\n\n';
    md += '**Auteur** : ' + (S.objectif.auteur || '—') + '  ·  **Mainteneur du code** : ' + (S.objectif.mainteneur || '—') + '\n\n---\n\n';

    md += '## 1. À quoi sert cette application ?\n\n';
    md += '- **Objectif** : ' + (S.objectif.objectif || '—') + '\n';
    md += '- **Contexte / problème** : ' + (S.objectif.contexte || '—') + '\n';
    md += '- **Pour qui** : ' + (S.objectif.pourQui || '—') + '\n\n---\n\n';

    md += '## 2. Comment ça se passe aujourd\'hui ?\n\n';
    md += '- **Existant** : ' + (S.situation.existant || '—') + '\n';
    md += '- **Étapes actuelles** :\n' + listMd(S.situation.etapes);
    md += '- **Points de douleur** :\n' + listMd(S.situation.douleurs);
    md += '\n---\n\n';

    md += '## 3. Qui sont les utilisateurs ?\n\n' + tableMd(S.acteurs, ['role','description'], ['Rôle métier','Description']) + '\n---\n\n';
    md += '## 4. Quelles sont les informations gérées ?\n\n' + tableMd(S.informations, ['objet','infos','precisions'], ['Objet métier','Informations importantes','Précisions']) + '\n---\n\n';
    md += '## 5. Que font les utilisateurs avec ces informations ?\n\n' + tableMd(S.actions, ['acteur','action','objet','detail'], ['Acteur','Action','Objet','Détail']) + '\n---\n\n';
    md += '## 6. Quels écrans / parcours sont attendus ?\n\n' + tableMd(S.ecrans, ['nom','objectif','precisions'], ['Écran / parcours','Objectif','Précisions']) + '\n---\n\n';
    md += '## 7. Quelles sont les règles à respecter ?\n\n' + tableMd(S.regles, ['regle','precisions'], ['Règle','Précisions']) + '\n---\n\n';

    md += '## 8. Quel est le processus / déroulement ?\n\n';
    if (S.processus.mermaid && S.processus.mermaid.trim()) md += '```mermaid\n' + S.processus.mermaid + '\n```\n'; else md += '_Aucun._\n';
    md += '\n---\n\n';

    md += '## 9. Avec quels autres systèmes échanger ?\n\n' + tableMd(S.echanges, ['systeme','flux'], ['Système','Échange']) + '\n---\n\n';

    md += '## 10. Quelles sont les exigences & contraintes ?\n\n';
    md += '- **Performance** : ' + (S.exigences.performance || '—') + '\n';
    md += '- **Accès & sécurité** : ' + (S.exigences.acces || '—') + '\n';
    md += '- **Contraintes** : ' + (S.exigences.contraintes || '—') + '\n';
    md += '- **Autres** : ' + (S.exigences.autres || '—') + '\n\n';

    md += '---\n\n© 2026 POULIDOR Audit & Développement — Outil interne (tous droits réservés). Généré par le canevas de cahier des charges.\n';
    download('cahier-des-charges.md', md, 'text/markdown');
    clearDirty();
  }

  // ============================================================ EXPORT / IMPORT JSON (round-trip)
  function showImportError(msg){ const e = $('import-error'); e.textContent = msg; e.classList.add('show'); }
  function hideImportError(){ const e = $('import-error'); e.classList.remove('show'); e.textContent = ''; }
  function exportJSON() {
    state.meta.updatedAt = new Date().toISOString().slice(0,10);
    download('cahier-des-charges.json', JSON.stringify(state, null, 2), 'application/json');
    clearDirty();
  }
  function validateState(obj) {
    if (!obj || typeof obj !== 'object') throw new Error('racine non-objet');
    if (!obj.sections || typeof obj.sections !== 'object') throw new Error('sections manquantes');
    SCHEMA_ORDER.forEach(k => { if (!(k in obj.sections)) throw new Error('section manquante : ' + k); });
    return obj;
  }
  function loadState(newState) {
    validateState(newState);
    const base = DEFAULT_STATE();
    base.meta = Object.assign(base.meta, newState.meta || {});
    SCHEMA_ORDER.forEach(k => {
      const v = newState.sections[k];
      const sv = SCHEMA[k];
      if (sv.type === 'object') base.sections[k] = Object.assign(base.sections[k], v || {});
      else if (sv.type === 'list') base.sections[k] = Array.isArray(v) ? v : [];
      else base.sections[k] = (v && typeof v === 'object' && typeof v.mermaid === 'string') ? { mermaid: v.mermaid } : base.sections[k];
    });
    state = base;
    renderAll();
    clearDirty();
  }
  function importJSON(text) { loadState(JSON.parse(text)); }

  // ============================================================ SPÉCIFICATION AGENT (manifest métier dérivé)
  function buildBootstrap() {
    const S = state.sections;
    const splitLines = (s) => String(s || '').split('\n').map(x => x.trim()).filter(Boolean);
    return {
      schema_version: '1.0',
      type: 'poulidor-app-business-spec',
      attribution: '© 2026 POULIDOR Audit & Développement — Outil interne (tous droits réservés).',
      note: "Spécification métier (non technique). L'agent Jellycode dérive la couche technique (modèle de données, endpoints, permissions, écrans) à partir de cette description.",
      generated_at: new Date().toISOString(),
      app: {
        name: S.objectif.app || '',
        slug: slugize(S.objectif.app),
        auteur: S.objectif.auteur || '',
        mainteneur: S.objectif.mainteneur || '',
        objectif: S.objectif.objectif || '',
        contexte: S.objectif.contexte || '',
        pour_qui: S.objectif.pourQui || '',
      },
      situation_actuelle: {
        existant: S.situation.existant || '',
        etapes: splitLines(S.situation.etapes),
        points_de_douleur: splitLines(S.situation.douleurs),
      },
      acteurs: (S.acteurs || []).map(a => ({ role_metier: a.role || '', description: a.description || '' })),
      objets_metier: (S.informations || []).map(o => ({ objet: o.objet || '', informations: o.infos || '', precisions: o.precisions || '' })),
      actions: (S.actions || []).map(a => ({ acteur: a.acteur || '', action: a.action || '', objet: a.objet || '', detail: a.detail || '' })),
      ecrans_parcours: (S.ecrans || []).map(e => ({ nom: e.nom || '', objectif: e.objectif || '', precisions: e.precisions || '' })),
      regles_metier: (S.regles || []).map(r => ({ regle: r.regle || '', precisions: r.precisions || '' })),
      processus: { mermaid: (S.processus && S.processus.mermaid) || '' },
      echanges: (S.echanges || []).map(e => ({ systeme: e.systeme || '', flux: e.flux || '' })),
      exigences: { performance: S.exigences.performance || '', acces_securite: S.exigences.acces || '', contraintes: S.exigences.contraintes || '', autres: S.exigences.autres || '' },
    };
  }
  function exportBootstrap() {
    download('cahier-des-charges.bootstrap.json', JSON.stringify(buildBootstrap(), null, 2), 'application/json');
    clearDirty();
  }

  // ============================================================ THEME / PRINT / INIT
  (function initChrome(){
    var p = new URLSearchParams(location.search).get('theme');
    if (p === 'dark' || p === 'light') document.documentElement.setAttribute('data-theme', p);
    $('btn-theme').addEventListener('click', function(){
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      var u = new URL(location); u.searchParams.set('theme', cur); history.replaceState(null,'',u);
      this.textContent = cur === 'dark' ? 'Mode clair' : 'Mode sombre';
    });
    $('btn-theme').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'Mode clair' : 'Mode sombre';
    $('btn-print').addEventListener('click', function(){ window.print(); });

    $('btn-md').addEventListener('click', exportMarkdown);
    $('btn-json-export').addEventListener('click', exportJSON);
    $('btn-bootstrap').addEventListener('click', exportBootstrap);
    $('btn-json-import').addEventListener('click', () => { hideImportError(); $('json-file').click(); });
    $('json-file').addEventListener('change', (ev) => {
      const file = ev.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try { importJSON(reader.result); hideImportError(); }
        catch(e){ showImportError('JSON invalide : ' + e.message); }
      };
      reader.readAsText(file);
      ev.target.value = '';
    });

    // exports toujours disponibles (un brouillon partiel reste exportable)
    $('btn-md').disabled = false;
    $('btn-json-export').disabled = false;
    window.addEventListener('beforeunload', (ev) => {
      if (dirty) { ev.preventDefault(); ev.returnValue = ''; }
    });
    renderAll();
  })();
  </script>
</body>
