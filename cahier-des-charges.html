<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canevas — Cahier des charges</title>
  <link rel="stylesheet" href="frontend/public/design-system/current/global.css">
  <link rel="stylesheet" href="frontend/public/design-system/current/bootstrap-icons/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    /* --on-accent : texte sur fond accentué (valeur de contraste indépendante du thème ;
       l'accent est saturé dans les 2 thèmes, le blanc reste lisible). Token centralisé. */
    :root { --on-accent: #fff; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--hub-font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-areas: "header header" "sommaire main";
      min-height: 100vh;
    }
    header.app-header {
      grid-area: header;
      display: flex;
      align-items: center;
      gap: var(--hub-space-4, 16px);
      padding: var(--hub-space-4, 16px) var(--hub-space-6, 24px);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    header.app-header h1 { font-size: var(--hub-font-size-xl, 20px); margin: 0; flex: 1 1 auto; }
    .toolbar { display: flex; gap: var(--hub-space-2, 8px); align-items: center; flex-wrap: wrap; }
    #progress { font-size: var(--hub-font-size-sm, 14px); color: var(--text-secondary); }

    .btn {
      font-family: inherit; font-size: var(--hub-font-size-sm, 14px);
      padding: var(--hub-space-2, 8px) var(--hub-space-3, 12px);
      border: 1px solid var(--border); border-radius: var(--radius-hub, 8px);
      background: var(--bg-secondary); color: var(--text-primary); cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
    .btn-secondary { background: var(--bg-secondary); }
    .btn-small { padding: var(--hub-space-1, 4px) var(--hub-space-2, 8px); font-size: var(--hub-font-size-xs, 12px); }
    .btn-danger { color: var(--error); border-color: var(--error); }
    .btn i.bi, .acc-header i.bi, .sommaire-list i.bi { margin-right: var(--hub-space-2, 8px); }

    #import-error {
      display: none; margin: 0 var(--hub-space-6, 24px) var(--hub-space-3, 12px);
      padding: var(--hub-space-3, 12px); border-radius: var(--radius-hub, 8px);
      background: var(--error); color: var(--on-accent); font-size: var(--hub-font-size-sm, 14px);
    }
    #import-error.show { display: block; }

    aside#sommaire {
      grid-area: sommaire;
      position: sticky; top: 0; align-self: start;
      max-height: 100vh; overflow-y: auto;
      padding: var(--hub-space-4, 16px);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
    }
    aside#sommaire h2 { font-size: var(--hub-font-size-sm, 14px); text-transform: uppercase; color: var(--text-secondary); margin: 0 0 var(--hub-space-2, 8px); }
    .sommaire-list { list-style: none; margin: 0; padding: 0; }
    .sommaire-list li { margin-bottom: var(--hub-space-1, 4px); }
    .sommaire-list a {
      display: flex; align-items: center; gap: var(--hub-space-2, 8px);
      color: var(--text-primary); text-decoration: none; font-size: var(--hub-font-size-sm, 14px);
      padding: var(--hub-space-1, 4px) var(--hub-space-2, 8px); border-radius: var(--radius-hub-sm, 6px);
    }
    .sommaire-list a:hover { background: var(--bg-primary); }
    .ind { width: 10px; text-align: center; color: var(--text-secondary); }
    .ind.filled { color: var(--success); }

    main#sections { grid-area: main; padding: var(--hub-space-6, 24px); max-width: 900px; }

    section.acc { border: 1px solid var(--border); border-radius: var(--radius-hub, 8px); margin-bottom: var(--hub-space-3, 12px); background: var(--bg-secondary); overflow: hidden; }
    .acc-header {
      width: 100%; text-align: left; display: flex; align-items: center; gap: var(--hub-space-2, 8px);
      padding: var(--hub-space-3, 12px) var(--hub-space-4, 16px);
      background: transparent; border: none; cursor: pointer;
      font-family: inherit; font-size: var(--hub-font-size-md, 16px); font-weight: var(--hub-font-weight-semibold, 600);
      color: var(--text-primary);
    }
    .acc-header:hover { background: var(--bg-primary); }
    .acc-chevron { margin-left: auto; transition: transform .15s; color: var(--text-secondary); }
    section.acc.open .acc-chevron { transform: rotate(180deg); }
    .acc-body { display: none; padding: var(--hub-space-4, 16px); border-top: 1px solid var(--border); }
    section.acc.open .acc-body { display: block; }

    .field { margin-bottom: var(--hub-space-3, 12px); }
    .field label { display: block; font-size: var(--hub-font-size-sm, 14px); margin-bottom: var(--hub-space-1, 4px); color: var(--text-secondary); }
    .field input[type=text], .field textarea, .field select, .data-input {
      width: 100%; font-family: inherit; font-size: var(--hub-font-size-sm, 14px);
      padding: var(--hub-space-2, 8px); border: 1px solid var(--border); border-radius: var(--radius-hub-sm, 6px);
      background: var(--bg-primary); color: var(--text-primary);
    }
    .field textarea { min-height: 60px; resize: vertical; }
    .field .req { color: var(--error); }

    .list-item {
      border: 1px solid var(--border); border-radius: var(--radius-hub-sm, 6px);
      padding: var(--hub-space-3, 12px); margin-bottom: var(--hub-space-2, 8px); background: var(--bg-primary);
    }
    .list-item-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--hub-space-2, 8px); }
    .list-item-head .title { font-weight: var(--hub-font-weight-semibold, 600); font-size: var(--hub-font-size-sm, 14px); }
    .list-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--hub-space-2, 8px); }
    .hint { font-size: var(--hub-font-size-sm, 14px); color: var(--text-secondary); font-style: italic; }

    .crud-table { width: 100%; border-collapse: collapse; font-size: var(--hub-font-size-sm, 14px); }
    .crud-table th, .crud-table td { border: 1px solid var(--border); padding: var(--hub-space-2, 8px); text-align: center; }
    .crud-table th { background: var(--bg-secondary); }
    .crud-actions { display: flex; gap: var(--hub-space-1, 4px); justify-content: center; flex-wrap: wrap; }
    .crud-actions label { font-size: var(--hub-font-size-xs, 12px); display: inline-flex; align-items: center; gap: 2px; color: var(--text-secondary); }

    .entity-card { border: 1px solid var(--border); border-radius: var(--radius-hub-sm, 6px); padding: var(--hub-space-3, 12px); margin-bottom: var(--hub-space-3, 12px); background: var(--bg-primary); }
    .champ-row { display: grid; grid-template-columns: 2fr 1fr 1fr 2fr auto; gap: var(--hub-space-2, 8px); align-items: end; margin-bottom: var(--hub-space-2, 8px); }
    .mermaid-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: var(--hub-space-3, 12px); }
    .mermaid-wrap textarea { min-height: 200px; font-family: var(--hub-font-mono); }
    #mermaid-preview { border: 1px dashed var(--border); border-radius: var(--radius-hub-sm, 6px); padding: var(--hub-space-3, 12px); min-height: 200px; background: var(--bg-primary); text-align: center; }
    .cheatsheet { font-size: var(--hub-font-size-xs, 12px); color: var(--text-secondary); background: var(--bg-primary); padding: var(--hub-space-2, 8px); border-radius: var(--radius-hub-sm, 6px); margin-top: var(--hub-space-2, 8px); }

    @media (max-width: 760px) {
      body { grid-template-columns: 1fr; grid-template-areas: "header" "sommaire" "main"; }
      aside#sommaire { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
      .list-grid, .mermaid-wrap { grid-template-columns: 1fr; }
      .champ-row { grid-template-columns: 1fr; }
    }
    @media print {
      body { display: block; }
      aside#sommaire, .toolbar, .acc-chevron { display: none !important; }
      section.acc .acc-body { display: block !important; }
      section.acc { break-inside: avoid; border: none; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1><span id="app-title">Nouveau cahier des charges</span></h1>
    <span id="progress">0/10 sections</span>
    <div class="toolbar">
      <button class="btn btn-primary" id="btn-md" disabled>Exporter Markdown</button>
      <button class="btn btn-secondary" id="btn-json-export" disabled>Exporter JSON</button>
      <button class="btn btn-secondary" id="btn-json-import">Importer JSON</button>
      <input type="file" id="json-file" accept="application/json" hidden>
      <button class="btn btn-secondary" id="btn-print">Imprimer / PDF</button>
      <button class="btn btn-secondary" id="btn-theme">Mode sombre</button>
    </div>
  </header>
  <div id="import-error" role="alert"></div>
  <aside id="sommaire"><h2>Sommaire</h2><ul class="sommaire-list" id="sommaire-list"></ul></aside>
  <main id="sections"></main>
  <script>
  // ============================================================ SCHEMA
  const SCHEMA = {
    identite: { title: '1. Identité & contexte', icon: 'bi bi-clipboard-data', type: 'object', fields: [
      { key: 'app', label: 'Nom de l\'app', type: 'text', required: true },
      { key: 'slug', label: 'Slug', type: 'text', required: true },
      { key: 'objectif', label: 'Objectif (1 phrase)', type: 'text', required: true },
      { key: 'contexte', label: 'Contexte métier', type: 'textarea' },
      { key: 'fait', label: 'Périmètre — ce que l\'app fait', type: 'textarea' },
      { key: 'neFaitPas', label: 'Périmètre — ce que l\'app ne fait pas', type: 'textarea' },
    ]},
    acteurs: { title: '2. Acteurs & rôles', icon: 'bi bi-people-fill', type: 'list', addLabel: '+ Acteur', item: [
      { key: 'role', label: 'Rôle', type: 'select', options: ['viewer','user','manager','admin'] },
      { key: 'libelle', label: 'Libellé métier', type: 'text' },
      { key: 'description', label: 'Description', type: 'textarea' },
    ]},
    donnees: { title: '3. Données (modèle)', icon: 'bi bi-database-fill', custom: 'donnees' },
    interactions: { title: '4. Interactions × données', icon: 'bi bi-arrow-left-right', custom: 'crud' },
    affichage: { title: '5. Affichage & objectifs', icon: 'bi bi-display', type: 'list', addLabel: '+ Vue', item: [
      { key: 'nom', label: 'Nom de la vue', type: 'text' },
      { key: 'objectif', label: 'Objectif', type: 'text' },
      { key: 'type', label: 'Type', type: 'select', options: ['liste','détail','dashboard','formulaire','autre'] },
      { key: 'donnees', label: 'Données affichées', type: 'textarea' },
    ]},
    regles: { title: '6. Règles de gestion', icon: 'bi bi-list-check', type: 'list', addLabel: '+ Règle', item: [
      { key: 'regle', label: 'Règle', type: 'textarea' },
      { key: 'portee', label: 'Portée', type: 'select', options: ['globale','par entité'] },
      { key: 'severite', label: 'Sévérité', type: 'select', options: ['bloquante','avertissement'] },
    ]},
    logigramme: { title: '7. Logigramme', icon: 'bi bi-signpost-2-split', custom: 'mermaid' },
    m2m: { title: '8. Intégrations M2M', icon: 'bi bi-plug-fill', type: 'list', addLabel: '+ Intégration', item: [
      { key: 'app', label: 'App partenaire', type: 'text' },
      { key: 'direction', label: 'Direction', type: 'select', options: ['consomme','expose'] },
      { key: 'endpoint', label: 'Endpoint', type: 'text' },
      { key: 'description', label: 'Description', type: 'textarea' },
    ]},
    fonctions: { title: '9. Fonctions / backend nécessaires', icon: 'bi bi-gear-fill', custom: 'fonctions' },
    exigences: { title: '10. Exigences non-fonctionnelles', icon: 'bi bi-bullseye', type: 'object', fields: [
      { key: 'perf', label: 'Performance', type: 'textarea' },
      { key: 'securite', label: 'Sécurité', type: 'textarea' },
      { key: 'contraintes', label: 'Contraintes', type: 'textarea' },
      { key: 'dependances', label: 'Dépendances', type: 'textarea' },
    ]},
  };
  const SCHEMA_ORDER = Object.keys(SCHEMA);

  // ============================================================ ETAT
  function DEFAULT_STATE() {
    return {
      meta: { version: '1.0', updatedAt: new Date().toISOString().slice(0,10) },
      sections: {
        identite: { app:'', slug:'', objectif:'', contexte:'', fait:'', neFaitPas:'' },
        acteurs: [],
        donnees: [],
        interactions: [],
        affichage: [],
        regles: [],
        logigramme: { mermaid: 'flowchart TD\n    A([Déclencheur]) --> B{Décision}\n    B -->|Oui| C[Étape 1]\n    B -->|Non| D[Étape 2]\n    C --> E([Résultat])\n    D --> E' },
        m2m: [],
        fonctions: [],
        exigences: { perf:'', securite:'', contraintes:'', dependances:'' },
      }
    };
  }
  let state = DEFAULT_STATE();
  let dirty = false;
  const CUSTOM_RENDERERS = {}; // rempli tâches 4-6

  // ============================================================ HELPERS UI
  const $ = (id) => document.getElementById(id);
  function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

  function markDirty(){ dirty = true; }
  function clearDirty(){ dirty = false; }

  // Une section est "commencée" si elle contient au moins une valeur non vide
  function sectionIsEmpty(key) {
    const s = SCHEMA[key];
    const v = state.sections[key];
    if (s.type === 'object') return s.fields.every(f => !(v[f.key] && String(v[f.key]).trim()));
    if (s.type === 'list') return !v.some(it => Object.values(it).some(x => x && String(x).trim()));
    if (s.custom === 'mermaid') return !(v.mermaid && v.mermaid.trim());
    if (s.custom === 'donnees') return !v.some(e => (e.nom && e.nom.trim()) || e.champs.some(c => c.nom && c.nom.trim()));
    if (s.custom === 'crud') return !v.some(r => ['c','r','u','d'].some(a => r[a] && r[a].length));
    if (s.custom === 'fonctions') return !v.some(f => (f.endpoint && f.endpoint.trim()) || (f.description && f.description.trim()));
    return true;
  }

  // ============================================================ RENDU
  function renderAll() {
    const main = $('sections');
    main.innerHTML = '';
    SCHEMA_ORDER.forEach(key => main.appendChild(renderSection(key)));
    renderSommaire();
    updateProgress();
    updateTitle();
  }

  function renderSection(key) {
    const s = SCHEMA[key];
    const sec = el('section', 'acc');
    sec.id = 'sec-' + key;
    const header = el('button', 'acc-header');
    header.innerHTML =
      '<span class="ind" data-ind="' + key + '">○</span>' +
      '<span><i class="' + s.icon + '"></i>' + s.title + '</span>' +
      '<span class="acc-chevron">▾</span>';
    header.addEventListener('click', () => sec.classList.toggle('open'));
    const body = el('div', 'acc-body');
    sec.appendChild(header);
    sec.appendChild(body);
    renderSectionBody(key, body);
    updateSectionIndicator(key);
    return sec;
  }

  // Rend le contenu du body (utilisé aussi pour re-render après +/- sur listes)
  function renderSectionBody(key, body) {
    if (!body) body = $('sec-' + key).querySelector('.acc-body');
    body.innerHTML = '';
    const s = SCHEMA[key];
    if (s.custom) {
      if (CUSTOM_RENDERERS[s.custom]) body.appendChild(CUSTOM_RENDERERS[s.custom](key, s));
      else body.appendChild(el('p', 'hint', '(rendu dédié à venir)'));
    } else if (s.type === 'object') {
      s.fields.forEach(f => body.appendChild(renderField(key, f)));
    } else if (s.type === 'list') {
      body.appendChild(renderList(key, s));
    }
  }
  function rerenderSectionBody(key) {
    renderSectionBody(key, null);
    updateSectionIndicator(key);
    updateProgress();
  }

  function renderField(sectionKey, f) {
    const wrap = el('div', 'field');
    const lbl = el('label', null, f.label + (f.required ? ' <span class="req">*</span>' : ''));
    wrap.appendChild(lbl);
    let input;
    if (f.type === 'textarea') input = el('textarea');
    else if (f.type === 'select') { input = el('select'); f.options.forEach(o => { const op = el('option'); op.value = o; op.textContent = o; input.appendChild(op); }); }
    else { input = el('input'); input.type = 'text'; }
    input.value = state.sections[sectionKey][f.key] || '';
    input.addEventListener('input', () => {
      state.sections[sectionKey][f.key] = input.value;
      markDirty();
      if (sectionKey === 'identite') updateTitle();
      updateSectionIndicator(sectionKey);
      updateProgress();
      setExportEnabled();
    });
    wrap.appendChild(input);
    return wrap;
  }

  function renderList(sectionKey, s) {
    const container = el('div', 'list-section');
    const items = el('div', 'list-items');
    container.appendChild(items);
    state.sections[sectionKey].forEach((it, idx) => items.appendChild(renderListItem(sectionKey, s, idx)));
    const addBtn = el('button', 'btn btn-secondary btn-small', s.addLabel || '+ Ajouter');
    addBtn.addEventListener('click', () => {
      const newItem = {};
      s.item.forEach(f => { newItem[f.key] = f.type === 'select' ? f.options[0] : ''; });
      state.sections[sectionKey].push(newItem);
      markDirty();
      rerenderSectionBody(sectionKey);
      setExportEnabled();
    });
    container.appendChild(addBtn);
    return container;
  }

  function renderListItem(sectionKey, s, idx) {
    const item = state.sections[sectionKey][idx];
    const card = el('div', 'list-item');
    const head = el('div', 'list-item-head');
    const titleTxt = (item[s.item[0].key] && String(item[s.item[0].key]).trim()) || ('Élément ' + (idx+1));
    head.appendChild(el('span', 'title', titleTxt));
    const del = el('button', 'btn btn-danger btn-small', 'Supprimer');
    del.addEventListener('click', () => {
      state.sections[sectionKey].splice(idx, 1);
      markDirty();
      rerenderSectionBody(sectionKey);
      if (sectionKey === 'donnees') { resyncAfterDonnees(); }
      setExportEnabled();
    });
    head.appendChild(del);
    card.appendChild(head);
    const grid = el('div', 'list-grid');
    s.item.forEach(f => {
      const cell = el('div', 'field');
      cell.appendChild(el('label', null, f.label));
      let input;
      if (f.type === 'textarea') input = el('textarea');
      else if (f.type === 'select') { input = el('select'); f.options.forEach(o => { const op = el('option'); op.value = o; op.textContent = o; input.appendChild(op); }); }
      else { input = el('input'); input.type = 'text'; }
      input.value = item[f.key] || '';
      input.addEventListener('input', () => {
        item[f.key] = input.value;
        markDirty();
        if (f.key === s.item[0].key) head.querySelector('.title').textContent = input.value.trim() || ('Élément ' + (idx+1));
        updateSectionIndicator(sectionKey);
        updateProgress();
        setExportEnabled();
      });
      cell.appendChild(input);
      grid.appendChild(cell);
    });
    card.appendChild(grid);
    return card;
  }

  // ============================================================ SOMMAIRE / PROGRESSION
  function renderSommaire() {
    const ul = $('sommaire-list'); ul.innerHTML = '';
    SCHEMA_ORDER.forEach(key => {
      const li = el('li');
      const a = el('a', null, '<span class="ind" data-ind="' + key + '">○</span> ' + SCHEMA[key].title);
      a.href = '#sec-' + key;
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        const sec = $('sec-' + key); sec.classList.add('open');
        sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      li.appendChild(a); ul.appendChild(li);
    });
  }
  function updateSectionIndicator(key) {
    const filled = !sectionIsEmpty(key);
    document.querySelectorAll('[data-ind="' + key + '"]').forEach(n => {
      n.textContent = filled ? '●' : '○';
      n.classList.toggle('filled', filled);
    });
  }
  function updateProgress() {
    const total = SCHEMA_ORDER.length;
    const done = SCHEMA_ORDER.filter(k => !sectionIsEmpty(k)).length;
    $('progress').textContent = done + '/' + total + ' sections';
  }
  function updateTitle() {
    const app = state.sections.identite.app || state.sections.identite.slug;
    $('app-title').textContent = app ? ('Cahier des charges — ' + app) : 'Nouveau cahier des charges';
  }
  function setExportEnabled() { /* activé dès la 1ère saisie ; reste tjrs dispo en pratique */ }

  // ============================================================ RESYNC (placeholder, implémenté tâche 4)
  function resyncAfterDonnees() { if (typeof rerenderInteractions === 'function') rerenderInteractions(); }

  // ============================================================ §3 DONNEES (builder d'entités)
  const CHAMP_TYPES = ['text','number','bool','date','datetime','relation','json','file'];
  const CHAMP_ROLES = ['id','info','relation'];
  CUSTOM_RENDERERS.donnees = function (key, s) {
    const wrap = el('div');
    const arr = state.sections.donnees;
    if (arr.length === 0) wrap.appendChild(el('p', 'hint', 'Aucune entité. Cliquez sur « + Entité » pour définir le modèle de données.'));
    arr.forEach((ent, idx) => wrap.appendChild(renderEntityCard(key, idx)));
    const add = el('button', 'btn btn-secondary btn-small', '+ Entité');
    add.addEventListener('click', () => {
      arr.push({ nom:'', description:'', champs: [] });
      markDirty();
      rerenderSectionBody(key);
      resyncAfterDonnees();
      setExportEnabled();
    });
    wrap.appendChild(add);
    return wrap;
  };
  function renderEntityCard(sectionKey, idx) {
    const ent = state.sections.donnees[idx];
    const card = el('div', 'entity-card');
    const head = el('div', 'list-item-head');
    head.appendChild(el('span', 'title', (ent.nom && ent.nom.trim()) || ('Entité ' + (idx+1))));
    const del = el('button', 'btn btn-danger btn-small', 'Supprimer l\'entité');
    del.addEventListener('click', () => {
      state.sections.donnees.splice(idx, 1);
      markDirty();
      rerenderSectionBody(sectionKey);
      resyncAfterDonnees();
      setExportEnabled();
    });
    head.appendChild(del); card.appendChild(head);

    const nomF = el('div', 'field');
    nomF.appendChild(el('label', null, 'Nom de l\'entité'));
    const nomI = el('input'); nomI.type = 'text'; nomI.value = ent.nom || '';
    nomI.addEventListener('input', () => {
      ent.nom = nomI.value;
      head.querySelector('.title').textContent = ent.nom.trim() || ('Entité ' + (idx+1));
      markDirty(); updateSectionIndicator(sectionKey); updateProgress();
      resyncAfterDonnees(); setExportEnabled();
    });
    nomF.appendChild(nomI); card.appendChild(nomF);

    const descF = el('div', 'field');
    descF.appendChild(el('label', null, 'Description'));
    const descI = el('textarea'); descI.value = ent.description || '';
    descI.addEventListener('input', () => { ent.description = descI.value; markDirty(); updateSectionIndicator(sectionKey); updateProgress(); });
    descF.appendChild(descI); card.appendChild(descF);

    card.appendChild(el('label', null, 'Champs'));
    ent.champs.forEach((c, ci) => card.appendChild(renderChampRow(sectionKey, idx, ci)));
    const addChamp = el('button', 'btn btn-secondary btn-small', '+ Champ');
    addChamp.addEventListener('click', () => {
      ent.champs.push({ nom:'', type:'text', role:'info', note:'' });
      markDirty(); rerenderSectionBody(sectionKey);
    });
    card.appendChild(addChamp);
    return card;
  }
  function renderChampRow(sectionKey, entIdx, ci) {
    const ent = state.sections.donnees[entIdx];
    const c = ent.champs[ci];
    const row = el('div', 'champ-row');
    const mkField = (labelText, makeInput) => {
      const cell = el('div'); cell.appendChild(el('label', null, labelText));
      cell.appendChild(makeInput()); return cell;
    };
    row.appendChild(mkField('Nom', () => {
      const i = el('input'); i.type = 'text'; i.value = c.nom || '';
      i.addEventListener('input', () => { c.nom = i.value; markDirty(); updateSectionIndicator(sectionKey); updateProgress(); });
      return i;
    }));
    row.appendChild(mkField('Type', () => {
      const sel = el('select'); CHAMP_TYPES.forEach(t => { const o = el('option'); o.value = t; o.textContent = t; sel.appendChild(o); });
      sel.value = c.type || 'text';
      sel.addEventListener('change', () => { c.type = sel.value; markDirty(); });
      return sel;
    }));
    row.appendChild(mkField('Rôle', () => {
      const sel = el('select'); CHAMP_ROLES.forEach(t => { const o = el('option'); o.value = t; o.textContent = t; sel.appendChild(o); });
      sel.value = c.role || 'info';
      sel.addEventListener('change', () => { c.role = sel.value; markDirty(); });
      return sel;
    }));
    row.appendChild(mkField('Note', () => {
      const i = el('input'); i.type = 'text'; i.value = c.note || '';
      i.addEventListener('input', () => { c.note = i.value; markDirty(); });
      return i;
    }));
    const delCell = el('div');
    const del = el('button', 'btn btn-danger btn-small', '✕');
    del.addEventListener('click', () => { ent.champs.splice(ci, 1); markDirty(); rerenderSectionBody(sectionKey); });
    delCell.appendChild(del); row.appendChild(delCell);
    return row;
  }

  // ============================================================ §4 INTERACTIONS (matrice CRUD)
  const ROLES = ['viewer','user','manager','admin'];
  const ACTIONS = [['c','Créer'],['r','Lire'],['u','Modifier'],['d','Supprimer']];
  function entitiesFromState() { return state.sections.donnees.map(e => e.nom).filter(n => n && n.trim()); }
  function syncInteractionsToEntities() {
    const names = entitiesFromState();
    const existing = {}; state.sections.interactions.forEach(r => { existing[r.entite] = r; });
    state.sections.interactions = names.map(n => existing[n] || { entite: n, c:[], r:[], u:[], d:[] });
  }
  function rerenderInteractions() {
    const body = $('sec-interactions') && $('sec-interactions').querySelector('.acc-body');
    if (!body) return;
    syncInteractionsToEntities();
    renderSectionBody('interactions', body);
    updateSectionIndicator('interactions'); updateProgress();
  }
  CUSTOM_RENDERERS.crud = function (key, s) {
    syncInteractionsToEntities();
    const wrap = el('div');
    const rows = state.sections.interactions;
    if (rows.length === 0) { wrap.appendChild(el('p', 'hint', 'Définissez des entités en §3 Données pour alimenter la matrice.')); return wrap; }
    const table = el('table', 'crud-table');
    const thead = el('thead'); const htr = el('tr');
    htr.appendChild(el('th', null, 'Entité'));
    ACTIONS.forEach(a => htr.appendChild(el('th', null, a[1] + ' (rôles)')));
    thead.appendChild(htr); table.appendChild(thead);
    const tbody = el('tbody');
    rows.forEach((row, ri) => {
      const tr = el('tr');
      tr.appendChild(el('td', null, row.entite));
      ACTIONS.forEach(a => {
        const td = el('td');
        const box = el('div', 'crud-actions');
        ROLES.forEach(role => {
          const lab = el('label');
          const cb = el('input'); cb.type = 'checkbox'; cb.value = role;
          cb.checked = row[a[0]].indexOf(role) !== -1;
          cb.addEventListener('change', () => {
            const arr = row[a[0]];
            if (cb.checked) { if (arr.indexOf(role) === -1) arr.push(role); }
            else { const i = arr.indexOf(role); if (i !== -1) arr.splice(i,1); }
            markDirty(); updateSectionIndicator('interactions'); updateProgress(); setExportEnabled();
          });
          lab.appendChild(cb); lab.appendChild(document.createTextNode(role));
          box.appendChild(lab);
        });
        td.appendChild(box); tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); wrap.appendChild(table);
    wrap.appendChild(el('p', 'hint', 'Cochez, pour chaque entité et action, les rôles autorisés.'));
    return wrap;
  };

  // ============================================================ §7 LOGIGRAMME (Mermaid)
  let mermaidReady = false;
  if (window.mermaid) { try { window.mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', theme: 'default' }); mermaidReady = true; } catch(e){ mermaidReady = false; } }
  let renderTimer = null;
  CUSTOM_RENDERERS.mermaid = function (key, s) {
    const wrap = el('div');
    const grid = el('div', 'mermaid-wrap');
    const ta = el('textarea');
    ta.value = state.sections.logigramme.mermaid || '';
    ta.setAttribute('spellcheck', 'false');
    const preview = el('div'); preview.id = 'mermaid-preview';
    grid.appendChild(ta); grid.appendChild(preview);
    wrap.appendChild(grid);

    const cheats = el('div', 'cheatsheet',
      '<strong>Antisèche :</strong> flowchart TD (top-down) ou LR (left-right). ' +
      'Nœuds : <code>A[Texte]</code>, <code>B{Décision}</code>, <code>C([Arrondi])</code>, <code>D((Cercle))</code>. ' +
      'Liens : <code>A --&gt; B</code>, <code>A --&gt;|Oui| B</code>, <code>C -. pointillé .-&gt; D</code>. Subgraph : <code>subgraph Nom ... end</code>.'
    );
    wrap.appendChild(cheats);

    function doRender() {
      const code = ta.value;
      state.sections.logigramme.mermaid = code;
      markDirty(); updateSectionIndicator('logigramme'); updateProgress(); setExportEnabled();
      if (!mermaidReady || !code.trim()) { preview.innerHTML = '<span class="hint">Aperçu indisponible (Mermaid non chargé ou code vide).</span>'; return; }
      const id = 'mmd-' + Date.now();
      window.mermaid.render(id, code).then(res => { preview.innerHTML = res.svg; })
        .catch(err => { preview.innerHTML = '<span class="hint" style="color:var(--error)">Erreur Mermaid : ' + String(err.message || err).replace(/[<>]/g,'') + '</span>'; });
    }
    ta.addEventListener('input', () => { clearTimeout(renderTimer); renderTimer = setTimeout(doRender, 300); });
    setTimeout(doRender, 50);
    return wrap;
  };

  // ============================================================ §9 FONCTIONS (pré-remplissables)
  const METHODS = ['GET','POST','PUT','PATCH','DELETE'];
  function slugize(n) { return (n||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'entite'; }
  CUSTOM_RENDERERS.fonctions = function (key, s) {
    const wrap = el('div');
    const bar = el('div'); bar.style.marginBottom = 'var(--hub-space-3, 12px)';
    const prefill = el('button', 'btn btn-secondary btn-small', '🔄 Pré-remplir depuis §3 + §4');
    prefill.addEventListener('click', () => { prefillFonctions(); rerenderSectionBody(key); });
    bar.appendChild(prefill);
    wrap.appendChild(bar);

    const arr = state.sections.fonctions;
    if (arr.length === 0) wrap.appendChild(el('p', 'hint', 'Aucune fonction. Pré-remplissez depuis les données/interactions, ou ajoutez manuellement.'));
    arr.forEach((f, idx) => wrap.appendChild(renderFonctionRow(key, idx)));
    const add = el('button', 'btn btn-secondary btn-small', '+ Fonction');
    add.addEventListener('click', () => { arr.push({ endpoint:'', methode:'GET', description:'', suggere:false }); markDirty(); rerenderSectionBody(key); setExportEnabled(); });
    wrap.appendChild(add);
    return wrap;
  };
  function renderFonctionRow(sectionKey, idx) {
    const f = state.sections.fonctions[idx];
    const row = el('div', 'list-item');
    const head = el('div', 'list-item-head');
    const title = el('span', 'title', (f.endpoint && f.endpoint.trim()) ? (f.methode + ' ' + f.endpoint) : ('Fonction ' + (idx+1)));
    if (f.suggere) title.appendChild(el('span', 'hint', '  [suggéré]'));
    head.appendChild(title);
    const del = el('button', 'btn btn-danger btn-small', 'Supprimer');
    del.addEventListener('click', () => { state.sections.fonctions.splice(idx,1); markDirty(); rerenderSectionBody(sectionKey); setExportEnabled(); });
    head.appendChild(del); row.appendChild(head);

    const grid = el('div', 'list-grid');
    const mkField = (labelText, makeInput) => { const cell = el('div','field'); cell.appendChild(el('label',null,labelText)); cell.appendChild(makeInput()); return cell; };
    grid.appendChild(mkField('Endpoint', () => {
      const i = el('input'); i.type='text'; i.value = f.endpoint || '';
      i.addEventListener('input', () => { f.endpoint = i.value; head.querySelector('.title').firstChild.textContent = (f.endpoint.trim()? f.methode+' '+f.endpoint : 'Fonction '+(idx+1)); markDirty(); updateSectionIndicator(sectionKey); updateProgress(); setExportEnabled(); });
      return i;
    }));
    grid.appendChild(mkField('Méthode', () => {
      const sel = el('select'); METHODS.forEach(m => { const o=el('option'); o.value=m; o.textContent=m; sel.appendChild(o); });
      sel.value = f.methode || 'GET';
      sel.addEventListener('change', () => { f.methode = sel.value; head.querySelector('.title').firstChild.textContent = (f.endpoint.trim()? f.methode+' '+f.endpoint : 'Fonction '+(idx+1)); markDirty(); });
      return sel;
    }));
    grid.appendChild(mkField('Description', () => {
      const i = el('input'); i.type='text'; i.value = f.description || '';
      i.addEventListener('input', () => { f.description = i.value; markDirty(); updateSectionIndicator(sectionKey); updateProgress(); setExportEnabled(); });
      return i;
    }));
    row.appendChild(grid);
    return row;
  }
  // Génère les endpoints CRUD suggérés à partir de §3 (entités) et §4 (actions cochées), sans écraser l'existant.
  function prefillFonctions() {
    syncInteractionsToEntities();
    const existing = new Set(state.sections.fonctions.filter(f => !f.suggere).map(f => f.methode + ' ' + f.endpoint));
    // on retire d'abord les anciennes suggestions pour éviter les doublons
    state.sections.fonctions = state.sections.fonctions.filter(f => !f.suggere);
    state.sections.interactions.forEach(row => {
      const base = '/api/' + slugize(row.entite);
      const map = { c:['POST', base], r:['GET', base], u:['PUT', base + '/{id}'], d:['DELETE', base + '/{id}'] };
      ['c','r','u','d'].forEach(act => {
        if (row[act] && row[act].length) {
          const m = map[act][0], ep = map[act][1];
          const sig = m + ' ' + ep;
          if (!existing.has(sig)) state.sections.fonctions.push({ endpoint: ep, methode: m, description: row.entite + ' — ' + ACTIONS.find(a=>a[0]===act)[1] + ' (' + row[act].join(', ') + ')', suggere: true });
        }
      });
    });
    markDirty(); updateSectionIndicator('fonctions'); updateProgress(); setExportEnabled();
  }

  // ============================================================ EXPORT MARKDOWN
  function download(filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = el('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function esc(s) { return String(s == null ? '' : s).replace(/\|/g, '\\|'); }
  function exportMarkdown() {
    const S = state.sections;
    const meta = state.meta;
    const app = S.identite.app || '(sans nom)';
    let md = '';
    md += '# Cahier des charges — ' + app + '\n\n';
    md += '> Slug : `' + (S.identite.slug || '') + '` · Version doc : ' + (meta.version || '1.0') + ' · Maj : ' + (meta.updatedAt || '') + '\n\n---\n\n';

    // §1
    md += '## 1. Identité & contexte\n\n';
    md += '- **Objectif** : ' + (S.identite.objectif || '—') + '\n';
    md += '- **Contexte métier** : ' + (S.identite.contexte || '—') + '\n\n';
    md += '**Périmètre**\n\n';
    md += '- ✅ Fait : ' + (S.identite.fait || '—') + '\n';
    md += '- 🚫 Ne fait pas : ' + (S.identite.neFaitPas || '—') + '\n\n---\n\n';

    // §2 acteurs
    md += '## 2. Acteurs & rôles\n\n';
    if (S.acteurs.length) {
      md += '| Rôle | Libellé métier | Description |\n|---|---|---|\n';
      S.acteurs.forEach(a => { md += '| ' + esc(a.role) + ' | ' + esc(a.libelle) + ' | ' + esc(a.description) + ' |\n'; });
    } else md += '_Aucun._';
    md += '\n\n---\n\n';

    // §3 données
    md += '## 3. Données (modèle)\n\n';
    if (S.donnees.length) {
      S.donnees.forEach(ent => {
        md += '### Entité : ' + esc(ent.nom || '(sans nom)') + '\n\n';
        if (ent.description) md += '_' + esc(ent.description) + '_\n\n';
        if (ent.champs.length) {
          md += '| Champ | Type | Rôle | Note |\n|---|---|---|---|\n';
          ent.champs.forEach(c => { md += '| ' + esc(c.nom) + ' | ' + esc(c.type) + ' | ' + esc(c.role) + ' | ' + esc(c.note) + ' |\n'; });
        } else md += '_Aucun champ._\n';
        md += '\n';
      });
    } else md += '_Aucune entité._\n';
    md += '\n---\n\n';

    // §4 interactions (matrice)
    md += '## 4. Interactions × données (CRUD par rôle)\n\n';
    syncInteractionsToEntities();
    if (S.interactions.length) {
      md += '| Entité | Créer | Lire | Modifier | Supprimer |\n|---|---|---|---|---|\n';
      S.interactions.forEach(r => { md += '| ' + esc(r.entite) + ' | ' + esc(r.c.join(', ')) + ' | ' + esc(r.r.join(', ')) + ' | ' + esc(r.u.join(', ')) + ' | ' + esc(r.d.join(', ')) + ' |\n'; });
    } else md += '_Aucune._\n';
    md += '\n---\n\n';

    // §5 affichage
    md += '## 5. Affichage & objectifs\n\n';
    if (S.affichage.length) {
      md += '| Vue | Objectif | Type | Données affichées |\n|---|---|---|---|\n';
      S.affichage.forEach(v => { md += '| ' + esc(v.nom) + ' | ' + esc(v.objectif) + ' | ' + esc(v.type) + ' | ' + esc(v.donnees) + ' |\n'; });
    } else md += '_Aucune._\n';
    md += '\n---\n\n';

    // §6 règles
    md += '## 6. Règles de gestion\n\n';
    if (S.regles.length) {
      md += '| Règle | Portée | Sévérité |\n|---|---|---|\n';
      S.regles.forEach(r => { md += '| ' + esc(r.regle) + ' | ' + esc(r.portee) + ' | ' + esc(r.severite) + ' |\n'; });
    } else md += '_Aucune._\n';
    md += '\n---\n\n';

    // §7 logigramme
    md += '## 7. Logigramme\n\n';
    if (S.logigramme.mermaid && S.logigramme.mermaid.trim()) {
      md += '```mermaid\n' + S.logigramme.mermaid + '\n```\n';
    } else md += '_Aucun._\n';
    md += '\n---\n\n';

    // §8 M2M
    md += '## 8. Intégrations M2M\n\n';
    if (S.m2m.length) {
      md += '| App partenaire | Direction | Endpoint | Description |\n|---|---|---|---|\n';
      S.m2m.forEach(m => { md += '| ' + esc(m.app) + ' | ' + esc(m.direction) + ' | ' + esc(m.endpoint) + ' | ' + esc(m.description) + ' |\n'; });
    } else md += '_Aucune._\n';
    md += '\n---\n\n';

    // §9 fonctions
    md += '## 9. Fonctions / backend nécessaires\n\n';
    if (S.fonctions.length) {
      md += '| Méthode | Endpoint | Description | Origine |\n|---|---|---|---|\n';
      S.fonctions.forEach(f => { md += '| ' + esc(f.methode) + ' | ' + esc(f.endpoint) + ' | ' + esc(f.description) + ' | ' + (f.suggere ? 'suggéré' : 'manuel') + ' |\n'; });
    } else md += '_Aucune._\n';
    md += '\n---\n\n';

    // §10 exigences
    md += '## 10. Exigences non-fonctionnelles\n\n';
    md += '- **Performance** : ' + (S.exigences.perf || '—') + '\n';
    md += '- **Sécurité** : ' + (S.exigences.securite || '—') + '\n';
    md += '- **Contraintes** : ' + (S.exigences.contraintes || '—') + '\n';
    md += '- **Dépendances** : ' + (S.exigences.dependances || '—') + '\n\n';

    md += '---\n\n_Généré par le canevas de cahier des charges du template POULIDOR._\n';
    download('cahier-des-charges.md', md, 'text/markdown');
    clearDirty();
  }

  // ============================================================ THEME / PRINT / INIT
  (function initChrome(){
    var p = new URLSearchParams(location.search).get('theme');
    if (p === 'dark' || p === 'light') document.documentElement.setAttribute('data-theme', p);
    $('btn-theme').addEventListener('click', function(){
      var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', cur);
      var u = new URL(location); u.searchParams.set('theme', cur); history.replaceState(null,'',u);
      this.textContent = cur === 'dark' ? 'Mode clair' : 'Mode sombre';
    });
    $('btn-theme').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'Mode clair' : 'Mode sombre';
    $('btn-print').addEventListener('click', function(){ window.print(); });
    $('btn-md').addEventListener('click', exportMarkdown);
    renderAll();
  })();
  </script>
</body>
</html>
