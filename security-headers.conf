# Headers de sécurité — snippet factorisé (inclus via `include`).
#
# Règle d'héritage nginx : les directives add_header sont héritées d'un bloc
# parent (server) UNIQUEMENT si le bloc courant (location) ne définit AUCUN
# add_header. Dès qu'une location pose le moindre add_header (ex. Cache-Control
# pour le cache HTML/assets), elle perd TOUS les add_header hérités — les
# headers de sécurité ci-dessous disparaissaient donc des réponses servies par
# les locations de cache.
#
# → Ce snippet doit être inclus :
#   1. au niveau du bloc server (cas général) ;
#   2. en première ligne de chaque location qui redéfinit add_header.
#
# NB : ce fichier vit dans /etc/nginx/templates/ (PAS dans conf.d/ : tout
# *.conf présent dans conf.d/ est auto-inclus au niveau http par nginx).
# NB : la CSP est volontairement sans font-src pour l'instant — ne pas
# harmoniser avec d'autres apps du parc sans décision dédiée.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
